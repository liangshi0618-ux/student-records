<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生每日记录系统</title>
<script src="lib/supabase.min.js"></script>
<script src="lib/mammoth.min.js"></script>
<script src="lib/chart.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; height: 100vh; display: flex; overflow: hidden; }

/* 侧边栏 */
.sidebar { width: 240px; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 20px 16px; border-bottom: 1px solid #2a2a4e; }
.sidebar-header h2 { font-size: 16px; font-weight: 600; }
.sidebar-header p { font-size: 11px; color: #888; margin-top: 4px; }
.student-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.student-item { padding: 10px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background .2s; border-left: 3px solid transparent; }
.student-item:hover { background: #16213e; }
.student-item.active { background: #0f3460; border-left-color: #e94560; }
.student-item .name { font-size: 14px; }
.student-item .del-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: all .2s; }
.student-item:hover .del-btn { opacity: 1; }
.student-item .del-btn:hover { color: #e94560; background: rgba(233,69,96,.15); }
.add-student { padding: 12px 16px; border-top: 1px solid #2a2a4e; }
.add-student input { width: 100%; padding: 8px 10px; border: 1px solid #2a2a4e; border-radius: 6px; background: #16213e; color: #eee; font-size: 13px; outline: none; }
.add-student input:focus { border-color: #e94560; }
.add-student input::placeholder { color: #666; }

/* 主内容区 */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; justify-content: space-between; align-items: center; }
.main-header h2 { font-size: 18px; color: #1a1a2e; }
.header-actions { display: flex; gap: 8px; }

/* 标签页 */
.tabs { display: flex; background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 24px; }
.tab { padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent; color: #666; font-size: 14px; transition: all .2s; }
.tab:hover { color: #333; }
.tab.active { color: #e94560; border-bottom-color: #e94560; font-weight: 600; }

/* 内容区 */
.content { flex: 1; overflow-y: auto; padding: 20px 24px; }
.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* 加载动画 */
.loading { text-align: center; padding: 40px; color: #999; }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #e8e8e8; border-top-color: #e94560; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 表格 */
.table-wrapper { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
table { width: 100%; border-collapse: collapse; }
th { background: #fafafa; padding: 10px 14px; text-align: left; font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #e8e8e8; }
td { padding: 10px 14px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
tr:last-child td { border-bottom: none; }
tr.clickable { cursor: pointer; transition: background .15s; }
tr.clickable:hover { background: #fff5f5; }

/* 评分星星 */
.stars { color: #f0a500; font-size: 14px; letter-spacing: 1px; }

/* 状态标签 */
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.tag-done { background: #e6f7e9; color: #2d8c3c; }
.tag-undone { background: #fde8e8; color: #c0392b; }
.tag-partial { background: #fef3cd; color: #856404; }

/* 按钮 */
.btn { padding: 7px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: all .2s; display: inline-flex; align-items: center; gap: 4px; }
.btn-primary { background: #e94560; color: #fff; border-color: #e94560; }
.btn-primary:hover { background: #d63851; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-outline { background: #fff; color: #333; border-color: #d9d9d9; }
.btn-outline:hover { border-color: #e94560; color: #e94560; }
.btn-danger { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
.btn-danger:hover { color: #e94560; }

/* 模态框 */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 90%; max-width: 800px; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid #e8e8e8; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; border-radius: 12px 12px 0 0; }
.modal-header h3 { font-size: 16px; }
.modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
.modal-close:hover { color: #333; }
.modal-body { padding: 20px; }
.chart-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-box { background: #fafafa; border-radius: 8px; padding: 16px; }
.chart-box h4 { font-size: 13px; color: #666; margin-bottom: 12px; text-align: center; }
.chart-box canvas { max-height: 250px; }
.comparison-table { margin-top: 16px; }
.comparison-table table { font-size: 13px; }

/* 表单 */
.form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: flex-end; }
.form-row input, .form-row select, .form-row textarea { padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; outline: none; font-family: inherit; }
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #e94560; }
.form-row input[type="date"] { width: 140px; }
.form-row select { width: 140px; }
.form-row input[type="text"] { width: 160px; }
.form-row input[type="number"] { width: 80px; }
.form-row textarea { flex: 1; min-width: 200px; resize: vertical; }
.add-record { padding: 16px 20px; background: #fafafa; border-radius: 8px; margin-bottom: 16px; }

/* 导入预览 */
.import-preview { max-height: 300px; overflow-y: auto; background: #fafafa; padding: 12px; border-radius: 6px; margin: 12px 0; font-size: 13px; }
.import-preview table { font-size: 12px; }
.import-preview td, .import-preview th { padding: 6px 10px; }

/* 文件输入 */
.file-input-wrap { position: relative; display: inline-block; overflow: hidden; }
.file-input-wrap input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

/* 设置面板 */
.setup-banner { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; }
.setup-banner h3 { font-size: 15px; color: #856404; margin-bottom: 8px; }
.setup-banner p { font-size: 13px; color: #856404; margin-bottom: 4px; }
.setup-banner code { background: #f8f0d0; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
.setup-banner textarea { width: 100%; height: 80px; margin-top: 8px; padding: 8px; border: 1px solid #e0c060; border-radius: 6px; font-size: 12px; font-family: monospace; }

/* 连接状态 */
.conn-status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px; border-radius: 10px; }
.conn-status.online { background: #e6f7e9; color: #2d8c3c; }
.conn-status.offline { background: #fde8e8; color: #c0392b; }
.conn-dot { width: 6px; height: 6px; border-radius: 50%; }
.conn-status.online .conn-dot { background: #2d8c3c; }
.conn-status.offline .conn-dot { background: #c0392b; }

/* Toast */
.toast { position: fixed; top: 20px; right: 20px; background: #333; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 200; opacity: 0; transform: translateY(-10px); transition: all .3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

/* 响应式 */
@media (max-width: 768px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; max-height: 180px; flex-shrink: 0; }
  .chart-container { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
  <div class="sidebar-header">
    <h2>📋 学生记录</h2>
    <p>每日表现 · 作业 · 考试</p>
  </div>
  <div class="student-list" id="studentList">
    <div class="loading"><div class="spinner"></div></div>
  </div>
  <div class="add-student">
    <input type="text" id="newStudentInput" placeholder="+ 添加学生，按回车确认" disabled />
  </div>
</div>

<!-- 主内容 -->
<div class="main">
  <div class="main-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <h2 id="pageTitle">请选择或添加学生</h2>
      <span class="conn-status offline" id="connStatus"><span class="conn-dot"></span> 未连接</span>
    </div>
    <div class="header-actions">
      <label class="btn btn-outline file-input-wrap">
        📥 导入 Word
        <input type="file" id="wordFileInput" accept=".docx" />
      </label>
      <button class="btn btn-outline" onclick="exportJSON()">💾 导出备份</button>
    </div>
  </div>

  <!-- 标签页 -->
  <div class="tabs">
    <div class="tab active" data-tab="daily" onclick="switchTab('daily')">📝 每日表现</div>
    <div class="tab" data-tab="homework" onclick="switchTab('homework')">📖 作业情况</div>
    <div class="tab" data-tab="exam" onclick="switchTab('exam')">📊 考试成绩</div>
  </div>

  <!-- 内容区 -->
  <div class="content" id="contentArea"></div>
</div>

<!-- 考试成绩对比模态框 -->
<div class="modal-overlay" id="examCompareModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="examCompareTitle">考试成绩对比</h3>
      <button class="modal-close" onclick="closeExamCompare()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="chart-container">
        <div class="chart-box">
          <h4>📈 各科成绩趋势（折线图）</h4>
          <canvas id="lineChart"></canvas>
        </div>
        <div class="chart-box">
          <h4>📊 同次考试各科对比（柱状图）</h4>
          <canvas id="barChart"></canvas>
        </div>
      </div>
      <div class="comparison-table" id="comparisonTable"></div>
    </div>
  </div>
</div>

<!-- Word 导入预览模态框 -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <div class="modal-header">
      <h3>导入预览 — 从 Word 解析的数据</h3>
      <button class="modal-close" onclick="closeImportModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="import-preview" id="importPreview"></div>
      <div class="form-row" style="margin-top:12px;">
        <span style="font-size:13px;color:#666;">选择归类到哪个标签：</span>
        <select id="importTargetTab">
          <option value="daily">每日表现</option>
          <option value="homework">作业情况</option>
          <option value="exam">考试成绩</option>
        </select>
        <button class="btn btn-primary" onclick="confirmImport()">确认导入</button>
      </div>
      <p style="margin-top:8px;font-size:12px;color:#999;">提示：Word 表格应包含列：日期、详情/科目、分数或状态、备注。导入后可在对应标签页手动调整。</p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== 配置 ====================
// 从 localStorage 读取已保存的 Supabase 配置，或使用默认值
const SUPABASE_CONFIG = {
  url: localStorage.getItem('sb_url') || 'https://uneommfyllnipfllcfuc.supabase.co',
  anonKey: localStorage.getItem('sb_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuZW9tbWZ5bGxuaXBmbGxjZnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNjM2MDcsImV4cCI6MjA5MzYzOTYwN30.S0n8DMM1ffqhuL4T5lLi87zUjzk-dYDUaxfqBoiUQ1Q'
};

let sb = null;
let currentStudentId = null;
let currentTab = 'daily';
let studentsCache = [];
let importParsedRows = [];
let chartInstances = {};

// ==================== 初始化 Supabase ====================
function initSupabase() {
  if (!SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) {
    showSetupGuide();
    return false;
  }
  try {
    sb = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
    updateConnStatus('online');
    return true;
  } catch(e) {
    console.error('Supabase init error:', e);
    updateConnStatus('offline');
    return false;
  }
}

function updateConnStatus(status) {
  const el = document.getElementById('connStatus');
  el.className = 'conn-status ' + status;
  el.innerHTML = status === 'online'
    ? '<span class="conn-dot"></span> 已连接云端'
    : '<span class="conn-dot"></span> 未连接';
}

// ==================== 设置向导 ====================
function showSetupGuide() {
  document.getElementById('contentArea').innerHTML = `
    <div class="setup-banner">
      <h3>🔧 首次使用 — 连接 Supabase 数据库</h3>
      <p>1. 前往 <a href="https://supabase.com" target="_blank" style="color:#856404;">supabase.com</a> 注册并创建项目</p>
      <p>2. 在项目 Settings → API 中复制 <code>Project URL</code> 和 <code>anon public key</code></p>
      <p>3. 在 SQL Editor 中运行下面 SQL 建表（<a href="#" onclick="copySQL();return false;" style="color:#856404;">点击复制SQL</a>）</p>
      <p>4. 粘贴 URL 和 Key 到下方，点击「连接」</p>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <input type="text" id="setupUrl" placeholder="https://xxxxxxxxxx.supabase.co" style="flex:1;min-width:250px;padding:8px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;" />
        <input type="text" id="setupKey" placeholder="anon key (eyJh...)" style="flex:1;min-width:250px;padding:8px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;" />
        <button class="btn btn-primary" onclick="saveConfig()">连接数据库</button>
      </div>
      <p style="margin-top:8px;font-size:11px;color:#999;">配置保存在本地浏览器中，下次打开无需重复输入。</p>
    </div>
    <div class="empty-state">
      <div class="icon">🗄️</div>
      <p>连接 Supabase 后，所有数据将存储在云端，多设备共享</p>
    </div>
  `;
}

function copySQL() {
  const sql = `-- 建表语句（在 Supabase SQL Editor 中执行）
CREATE TABLE students (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  name TEXT NOT NULL,
  created_at TIMESTAMPTZ DEFAULT now()
);

CREATE TABLE daily_records (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  student_id UUID REFERENCES students(id) ON DELETE CASCADE,
  date DATE NOT NULL,
  rating INT CHECK (rating >= 1 AND rating <= 5),
  behavior TEXT NOT NULL,
  notes TEXT DEFAULT '',
  created_at TIMESTAMPTZ DEFAULT now()
);

CREATE TABLE homework_records (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  student_id UUID REFERENCES students(id) ON DELETE CASCADE,
  date DATE NOT NULL,
  subject TEXT NOT NULL,
  status TEXT CHECK (status IN ('完成','未完成','部分完成')),
  notes TEXT DEFAULT '',
  created_at TIMESTAMPTZ DEFAULT now()
);

CREATE TABLE exam_records (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  student_id UUID REFERENCES students(id) ON DELETE CASCADE,
  date DATE NOT NULL,
  subject TEXT NOT NULL,
  score NUMERIC NOT NULL,
  total_score NUMERIC NOT NULL DEFAULT 100,
  notes TEXT DEFAULT '',
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 允许公开访问（任何人都可读写，适合班级共用）
ALTER TABLE students ENABLE ROW LEVEL SECURITY;
ALTER TABLE daily_records ENABLE ROW LEVEL SECURITY;
ALTER TABLE homework_records ENABLE ROW LEVEL SECURITY;
ALTER TABLE exam_records ENABLE ROW LEVEL SECURITY;

CREATE POLICY "public_access" ON students FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "public_access" ON daily_records FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "public_access" ON homework_records FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "public_access" ON exam_records FOR ALL USING (true) WITH CHECK (true);`;

  navigator.clipboard.writeText(sql).then(() => showToast('SQL 已复制，粘贴到 Supabase SQL Editor 执行'));
}

function saveConfig() {
  const url = document.getElementById('setupUrl').value.trim();
  const key = document.getElementById('setupKey').value.trim();
  if (!url || !key) { showToast('请填写 URL 和 Key'); return; }
  localStorage.setItem('sb_url', url);
  localStorage.setItem('sb_key', key);
  SUPABASE_CONFIG.url = url;
  SUPABASE_CONFIG.anonKey = key;
  if (initSupabase()) {
    showToast('已连接数据库！');
    loadStudents();
  }
}

// ==================== Toast ====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}

// ==================== 学生管理 ====================
async function loadStudents() {
  if (!sb) return;
  document.getElementById('studentList').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const { data, error } = await sb.from('students').select('*').order('created_at', { ascending: true });
  if (error) { showToast('加载学生失败: ' + error.message); return; }
  studentsCache = data || [];
  renderStudentList();
}

function renderStudentList() {
  const list = document.getElementById('studentList');
  if (studentsCache.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:#666;font-size:13px;">暂无学生<br/>在下方输入添加</div>';
  } else {
    list.innerHTML = studentsCache.map(s => `
      <div class="student-item${s.id === currentStudentId ? ' active' : ''}" onclick="selectStudent('${s.id}')">
        <span class="name">👤 ${escapeHtml(s.name)}</span>
        <button class="del-btn" onclick="event.stopPropagation();deleteStudent('${s.id}')" title="删除">×</button>
      </div>
    `).join('');
  }
  document.getElementById('newStudentInput').disabled = false;
}

async function selectStudent(id) {
  currentStudentId = id;
  renderStudentList();
  const s = studentsCache.find(s => s.id === id);
  document.getElementById('pageTitle').textContent = s ? s.name : '请选择或添加学生';
  renderCurrentTab();
}

async function addStudent(name) {
  if (!sb) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  const { data, error } = await sb.from('students').insert({ name: trimmed }).select().single();
  if (error) { showToast('添加失败: ' + error.message); return; }
  studentsCache.push(data);
  document.getElementById('newStudentInput').value = '';
  renderStudentList();
  selectStudent(data.id);
  showToast('已添加 ' + trimmed);
}

async function deleteStudent(id) {
  if (!sb) return;
  if (!confirm('确定删除该学生及其所有记录？此操作不可恢复。')) return;
  const { error } = await sb.from('students').delete().eq('id', id);
  if (error) { showToast('删除失败: ' + error.message); return; }
  studentsCache = studentsCache.filter(s => s.id !== id);
  if (currentStudentId === id) {
    currentStudentId = studentsCache.length > 0 ? studentsCache[0].id : null;
  }
  renderStudentList();
  renderCurrentTab();
  if (!currentStudentId) {
    document.getElementById('pageTitle').textContent = '请选择或添加学生';
    document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="icon">👈</div><p>请先在左侧添加或选择学生</p></div>';
  }
}

document.getElementById('newStudentInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addStudent(this.value);
});

// ==================== 标签切换 ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderCurrentTab();
}

function renderCurrentTab() {
  if (!currentStudentId) {
    document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="icon">👈</div><p>请先在左侧添加或选择学生</p></div>';
    return;
  }
  if (!sb) {
    document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="icon">🔌</div><p>请先连接数据库</p></div>';
    return;
  }
  switch (currentTab) {
    case 'daily': renderDaily(); break;
    case 'homework': renderHomework(); break;
    case 'exam': renderExam(); break;
  }
}

// ==================== 每日表现 ====================
function renderDaily() {
  document.getElementById('contentArea').innerHTML = `
    <div class="add-record">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:#666;">添加表现记录</div>
      <div class="form-row">
        <input type="date" id="dailyDate" value="${today()}" />
        <select id="dailyRating">
          <option value="5">⭐⭐⭐⭐⭐ (优秀)</option>

// ==================== 考试成绩对比 ====================
async function openExamCompare(subject) {
  if (!sb || !currentStudentId) return;
  const { data, error } = await sb
    .from('exam_records')
    .select('*')
    .eq('student_id', currentStudentId)
    .eq('subject', subject)
    .order('date', { ascending: true });
  if (error) { showToast('加载失败: ' + error.message); return; }
  const subjectRecords = data || [];
  if (subjectRecords.length === 0) {
    showToast('该科目暂无考试记录');
    return;
  }

  const student = studentsCache.find(s => s.id === currentStudentId);
  document.getElementById('examCompareTitle').textContent = `${student?.name || ''} — ${subject} 考试对比`;
  document.getElementById('examCompareModal').classList.add('show');

  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  setTimeout(() => {
    const dates = subjectRecords.map(r => r.date);
    const scores = subjectRecords.map(r => Number(r.score));
    const totals = subjectRecords.map(r => Number(r.total_score));
    const percentages = subjectRecords.map(r => r.total_score > 0 ? Math.round(r.score / r.total_score * 100) : 0);

    const lineCtx = document.getElementById('lineChart').getContext('2d');
    chartInstances.line = new Chart(lineCtx, {
      type: 'line',
      data: {
        labels: dates,
        datasets: [{
          label: '得分率 (%)',
          data: percentages,
          borderColor: '#e94560',
          backgroundColor: 'rgba(233,69,96,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 5,
          pointBackgroundColor: '#e94560'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } }
      }
    });

    const barCtx = document.getElementById('barChart').getContext('2d');
    chartInstances.bar = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: dates,
        datasets: [{
          label: '得分',
          data: scores,
          backgroundColor: '#0f3460',
          borderRadius: 4
        }, {
          label: '总分',
          data: totals,
          backgroundColor: 'rgba(15,52,96,0.15)',
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true } }
      }
    });

    document.getElementById('comparisonTable').innerHTML = `
      <h4 style="margin-bottom:8px;font-size:14px;color:#666;">📋 ${escapeHtml(subject)} 历次考试详情</h4>
      <div class="table-wrapper"><table>
        <thead><tr><th>日期</th><th>得分</th><th>总分</th><th>得分率</th><th>备注</th></tr></thead>
        <tbody>${subjectRecords.map(r => {
          const pct = r.total_score > 0 ? Math.round(r.score / r.total_score * 100) : 0;
          return `<tr>
            <td>${r.date}</td><td>${r.score}</td><td>${r.total_score}</td>
            <td style="font-weight:600;color:${pct >= 90 ? '#2d8c3c' : pct >= 60 ? '#f0a500' : '#c0392b'};">${pct}%</td>
            <td>${escapeHtml(r.notes || '-')}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;
  }, 100);
}

function closeExamCompare() {
  document.getElementById('examCompareModal').classList.remove('show');
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};
}

document.getElementById('examCompareModal').addEventListener('click', function(e) {
  if (e.target === this) closeExamCompare();
});

// ==================== Word 导入 ====================
document.getElementById('wordFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.name.endsWith('.docx')) { showToast('请选择 .docx 格式的 Word 文件'); return; }

  const reader = new FileReader();
  reader.onload = function(evt) {
    mammoth.convertToHtml({ arrayBuffer: evt.target.result })
      .then(result => {
        const rows = parseWordTable(result.value);
        if (rows.length === 0) {
          showToast('未在 Word 中找到表格数据，请确保文档中包含表格');
          return;
        }
        importParsedRows = rows;
        showImportPreview(rows);
      })
      .catch(() => showToast('解析 Word 文件失败'));
  };
  reader.readAsArrayBuffer(file);
  this.value = '';
});

function parseWordTable(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  const tables = div.querySelectorAll('table');
  if (tables.length === 0) return [];
  const rows = [];
  tables.forEach(table => {
    const trs = table.querySelectorAll('tr');
    trs.forEach((tr, idx) => {
      const cells = tr.querySelectorAll('td, th');
      const rowData = Array.from(cells).map(c => c.textContent.trim());
      if (rowData.length >= 2 && idx > 0) {
        rows.push(rowData);
      } else if (rowData.length >= 2 && idx === 0) {
        const isHeader = rowData.some(c => /日期|时间|date/i.test(c));
        if (!isHeader) rows.push(rowData);
      }
    });
  });
  return rows;
}

function showImportPreview(rows) {
  document.getElementById('importPreview').innerHTML = `
    <table>
      <thead><tr><th>#</th><th>列1</th><th>列2</th><th>列3</th><th>列4</th></tr></thead>
      <tbody>${rows.slice(0, 50).map((r, i) => `
        <tr><td>${i + 1}</td>${r.slice(0, 4).map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>
      `).join('')}</tbody>
    </table>
    ${rows.length > 50 ? `<p style="text-align:center;color:#999;margin-top:8px;">仅显示前50行，共${rows.length}行</p>` : ''}
  `;
  document.getElementById('importModal').classList.add('show');
}

function closeImportModal() {
  document.getElementById('importModal').classList.remove('show');
  importParsedRows = [];
}

document.getElementById('importModal').addEventListener('click', function(e) {
  if (e.target === this) closeImportModal();
});

async function confirmImport() {
  if (!sb || !currentStudentId) { showToast('请先选择学生'); return; }
  const targetTab = document.getElementById('importTargetTab').value;
  let count = 0;

  for (const row of importParsedRows) {
    const date = row[0] || today();
    const detail = row[1] || '';
    const value = row[2] || '';
    const notes = row[3] || '';
    let error = null;

    switch (targetTab) {
      case 'daily': {
        let rating = 3;
        const m = value.match(/(\d)/);
        if (m) { const r = parseInt(m[1]); if (r >= 1 && r <= 5) rating = r; }
        const res = await sb.from('daily_records').insert({ student_id: currentStudentId, date, rating, behavior: detail, notes });
        error = res.error; break;
      }
      case 'homework': {
        let status = '完成';
        if (/未|否|没|✗|×/i.test(value)) status = '未完成';
        else if (/部分|半/i.test(value)) status = '部分完成';
        const res = await sb.from('homework_records').insert({ student_id: currentStudentId, date, subject: detail, status, notes });
        error = res.error; break;
      }
      case 'exam': {
        const nums = value.match(/[\d.]+/g);
        const score = nums ? parseFloat(nums[0]) : 0;
        const total = nums && nums.length > 1 ? parseFloat(nums[1]) : 100;
        const res = await sb.from('exam_records').insert({ student_id: currentStudentId, date, subject: detail, score, total_score: total, notes });
        error = res.error; break;
      }
    }
    if (error) { console.error('Import error:', error); }
    else count++;
  }

  closeImportModal();
  switchTab(targetTab);
  showToast(`成功导入 ${count} 条记录`);
}

// ==================== 导出 ====================
async function exportJSON() {
  if (!sb) { showToast('请先连接数据库'); return; }
  showToast('正在导出...');

  const { data: students } = await sb.from('students').select('*');
  const { data: daily } = await sb.from('daily_records').select('*');
  const { data: homework } = await sb.from('homework_records').select('*');
  const { data: exams } = await sb.from('exam_records').select('*');

  const blob = new Blob([JSON.stringify({ students, daily_records: daily, homework_records: homework, exam_records: exams }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `学生记录备份_${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出完成');
}

// ==================== 工具函数 ====================
function today() {
  return new Date().toISOString().slice(0, 10);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
